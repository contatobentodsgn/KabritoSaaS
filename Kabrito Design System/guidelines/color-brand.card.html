<!-- @dsCard group="Colors" viewport="700x190" name="Brand Colors" subtitle="Black Forest · Mint Cream · Dusty Rose · Powder Blush" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--color-bg-subtle);padding:20px;font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .sw{border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--color-border-default);background:#fff}
  .chip{height:96px}
  .meta{padding:10px 12px}
  .nm{font-weight:600;font-size:14px;color:var(--color-text-primary)}
  .hx{font-size:12px;color:var(--color-text-muted);font-family:var(--font-mono);margin-top:2px}
  .role{font-size:11px;color:var(--color-text-muted);margin-top:4px}
</style></head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#075102"></div><div class="meta"><div class="nm">Black Forest</div><div class="hx">#075102</div><div class="role">Primary · autoridade</div></div></div>
  <div class="sw"><div class="chip" style="background:#ebf2eb"></div><div class="meta"><div class="nm">Mint Cream</div><div class="hx">#EBF2EB</div><div class="role">Background · base</div></div></div>
  <div class="sw"><div class="chip" style="background:#c77577"></div><div class="meta"><div class="nm">Dusty Rose</div><div class="hx">#C77577</div><div class="role">Secondary · afeto</div></div></div>
  <div class="sw"><div class="chip" style="background:#ffaca8"></div><div class="meta"><div class="nm">Powder Blush</div><div class="hx">#FFACA8</div><div class="role">Accent · calor</div></div></div>
</div>
</body></html>
