<!-- @dsCard group="Colors" viewport="700x130" name="Rose Scale" subtitle="Secondary ramp — 50 → 950" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--color-bg-subtle);padding:20px;font-family:var(--font-sans)}
  .ramp{display:grid;grid-template-columns:repeat(11,1fr);gap:6px}
  .cell{display:flex;flex-direction:column;gap:6px;align-items:center}
  .sw{width:100%;height:54px;border-radius:var(--radius-sm);border:1px solid rgba(7,81,2,.08)}
  .n{font-size:11px;font-weight:600;color:var(--color-text-secondary)}
</style></head>
<body>
<div class="ramp">
  <div class="cell"><div class="sw" style="background:var(--rose-50)"></div><div class="n">50</div></div>
  <div class="cell"><div class="sw" style="background:var(--rose-100)"></div><div class="n">100</div></div>
  <div class="cell"><div class="sw" style="background:var(--rose-200)"></div><div class="n">200</div></div>
  <div class="cell"><div class="sw" style="background:var(--rose-300)"></div><div class="n">300</div></div>
  <div class="cell"><div class="sw" style="background:var(--rose-400)"></div><div class="n">400</div></div>
  <div class="cell"><div class="sw" style="background:var(--rose-500);outline:2px solid var(--rose-700);outline-offset:1px"></div><div class="n">500</div></div>
  <div class="cell"><div class="sw" style="background:var(--rose-600)"></div><div class="n">600</div></div>
  <div class="cell"><div class="sw" style="background:var(--rose-700)"></div><div class="n">700</div></div>
  <div class="cell"><div class="sw" style="background:var(--rose-800)"></div><div class="n">800</div></div>
  <div class="cell"><div class="sw" style="background:var(--rose-900)"></div><div class="n">900</div></div>
  <div class="cell"><div class="sw" style="background:var(--rose-950)"></div><div class="n">950</div></div>
</div>
</body></html>
