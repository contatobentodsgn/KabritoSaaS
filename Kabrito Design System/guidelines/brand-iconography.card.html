<!-- @dsCard group="Brand" viewport="700x170" name="Iconography" subtitle="Lucide — 1.75px line icons, rounded caps (substitution)" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--color-bg-subtle);padding:24px;font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:10px}
  .cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--color-border-default);border-radius:var(--radius-md);color:var(--color-text-primary)}
  .note{font-size:11px;color:var(--color-text-muted);margin-top:12px}
  [data-lucide]{width:22px;height:22px;stroke-width:1.75}
</style></head>
<body>
<div class="grid">
  <div class="cell"><i data-lucide="leaf"></i></div>
  <div class="cell"><i data-lucide="heart"></i></div>
  <div class="cell"><i data-lucide="calendar"></i></div>
  <div class="cell"><i data-lucide="users"></i></div>
  <div class="cell"><i data-lucide="message-circle"></i></div>
  <div class="cell"><i data-lucide="book-open"></i></div>
  <div class="cell"><i data-lucide="sparkles"></i></div>
  <div class="cell"><i data-lucide="bell"></i></div>
  <div class="cell"><i data-lucide="settings"></i></div>
  <div class="cell"><i data-lucide="search"></i></div>
  <div class="cell"><i data-lucide="home"></i></div>
  <div class="cell"><i data-lucide="file-text"></i></div>
  <div class="cell"><i data-lucide="bar-chart-3"></i></div>
  <div class="cell"><i data-lucide="check-circle"></i></div>
  <div class="cell"><i data-lucide="plus"></i></div>
  <div class="cell"><i data-lucide="moon"></i></div>
  <div class="cell"><i data-lucide="sun"></i></div>
  <div class="cell"><i data-lucide="star"></i></div>
  <div class="cell"><i data-lucide="credit-card"></i></div>
  <div class="cell"><i data-lucide="arrow-right"></i></div>
</div>
<div class="note">Lucide · stroke 1.75 · rounded caps. Substitution — no proprietary icon set was provided.</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body></html>
