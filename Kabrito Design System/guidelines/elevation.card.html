<!-- @dsCard group="Spacing" viewport="700x160" name="Elevation" subtitle="Barely-there, warm-green tinted shadows" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--color-bg-default);padding:28px;font-family:var(--font-sans)}
  .grid{display:flex;gap:24px;flex-wrap:wrap}
  .cell{text-align:center}
  .box{width:120px;height:64px;background:#fff;border-radius:var(--radius-lg);border:1px solid var(--color-border-default)}
  .nm{font-size:12px;font-weight:600;margin-top:12px;color:var(--color-text-primary)}
  .d{font-size:11px;color:var(--color-text-muted)}
</style></head>
<body>
<div class="grid">
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-0)"></div><div class="nm">Level 0</div><div class="d">hairline only</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-1)"></div><div class="nm">Level 1</div><div class="d">soft — cards</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-2)"></div><div class="nm">Level 2</div><div class="d">popovers</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-3)"></div><div class="nm">Level 3</div><div class="d">modals</div></div>
</div>
</body></html>
