<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--color-bg-subtle);padding:24px;font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:1.3fr 1.3fr .7fr;gap:16px}
  .tile{border-radius:var(--radius-lg);border:1px solid var(--color-border-default);display:flex;align-items:center;justify-content:center;padding:24px;min-height:96px}
  .cap{font-size:11px;color:var(--color-text-muted);margin-top:8px;text-align:center}
</style></head>
<body>
<div class="grid">
  <div>
    <div class="tile" style="background:#fff"><img src="../assets/logo-kabrito.svg" width="200"></div>
    <div class="cap">Primary · sobre claro</div>
  </div>
  <div>
    <div class="tile" style="background:var(--forest-700)"><img src="../assets/logo-kabrito-inverse.svg" width="190"></div>
    <div class="cap">Inverse · sobre Black Forest</div>
  </div>
  <div>
    <div class="tile" style="background:#fff"><img src="../assets/logo-mark.svg" width="56"></div>
    <div class="cap">Mark</div>
  </div>
</div>
</body></html>
