<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing Scale" subtitle="8px base — xxs → 4xl" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--color-bg-subtle);padding:24px;font-family:var(--font-sans)}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:9px}
  .bar{height:16px;background:var(--forest-300);border-radius:3px}
  .nm{width:46px;font-size:12px;font-weight:600;color:var(--color-text-primary)}
  .px{font-size:11px;font-family:var(--font-mono);color:var(--color-text-muted)}
</style></head>
<body>
  <div class="row"><span class="nm">xxs</span><span class="bar" style="width:4px"></span><span class="px">4px</span></div>
  <div class="row"><span class="nm">xs</span><span class="bar" style="width:8px"></span><span class="px">8px</span></div>
  <div class="row"><span class="nm">sm</span><span class="bar" style="width:12px"></span><span class="px">12px</span></div>
  <div class="row"><span class="nm">md</span><span class="bar" style="width:16px"></span><span class="px">16px</span></div>
  <div class="row"><span class="nm">lg</span><span class="bar" style="width:24px"></span><span class="px">24px</span></div>
  <div class="row"><span class="nm">xl</span><span class="bar" style="width:32px"></span><span class="px">32px</span></div>
  <div class="row"><span class="nm">2xl</span><span class="bar" style="width:48px"></span><span class="px">48px</span></div>
  <div class="row"><span class="nm">3xl</span><span class="bar" style="width:64px"></span><span class="px">64px</span></div>
</body></html>
