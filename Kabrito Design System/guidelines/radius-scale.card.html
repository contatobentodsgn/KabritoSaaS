<!-- @dsCard group="Spacing" viewport="700x140" name="Radius Scale" subtitle="xs (fields) → full (pills)" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--color-bg-subtle);padding:24px;font-family:var(--font-sans)}
  .grid{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
  .cell{text-align:center}
  .box{width:72px;height:56px;background:var(--color-bg-surface);border:1px solid var(--color-border-strong);box-shadow:var(--shadow-1)}
  .nm{font-size:12px;font-weight:600;margin-top:8px;color:var(--color-text-primary)}
  .px{font-size:11px;font-family:var(--font-mono);color:var(--color-text-muted)}
</style></head>
<body>
<div class="grid">
  <div class="cell"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="nm">xs</div><div class="px">4px</div></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="nm">sm</div><div class="px">6px</div></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-md)"></div><div class="nm">md</div><div class="px">8px</div></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="nm">lg</div><div class="px">12px</div></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="nm">xl</div><div class="px">16px</div></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="nm">2xl</div><div class="px">24px</div></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-full);width:56px"></div><div class="nm">full</div><div class="px">pill</div></div>
</div>
</body></html>
