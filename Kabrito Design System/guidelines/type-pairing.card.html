<!-- @dsCard group="Type" viewport="700x160" name="Pairing" subtitle="Newsreader serif display over Inter UI" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--color-bg-subtle);padding:24px;color:var(--color-text-primary)}
  .wrap{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .big{font-family:var(--font-serif);font-size:60px;font-weight:500;line-height:1;letter-spacing:-1.5px}
  .lab{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--color-text-muted);margin-bottom:6px}
  .alpha{font-size:13px;color:var(--color-text-secondary);margin-top:6px;line-height:1.7}
</style></head>
<body>
<div class="wrap">
  <div>
    <div class="lab">Display · Newsreader</div>
    <div class="big">Aa</div>
    <div class="alpha" style="font-family:var(--font-serif)">ABCDEFG abcdefg 0123 — <em>itálico</em></div>
  </div>
  <div>
    <div class="lab">UI / Body · Inter</div>
    <div class="big" style="font-family:var(--font-sans);font-weight:600;letter-spacing:-2px">Aa</div>
    <div class="alpha">ABCDEFG abcdefg 0123 — regular · medium · semibold</div>
  </div>
</div>
</body></html>
