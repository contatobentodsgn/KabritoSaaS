<!-- @dsCard group="Colors" viewport="700x150" name="Gradients & Balance" subtitle="Editorial gradients + the 60/25/10/5 mix" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--color-bg-subtle);padding:20px;font-family:var(--font-sans)}
  .grads{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .g{height:56px;border-radius:var(--radius-lg);display:flex;align-items:flex-end;padding:8px 10px;color:#fff;font-size:11px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.25)}
  .bal{display:flex;height:30px;border-radius:var(--radius-full);overflow:hidden;border:1px solid var(--color-border-default)}
  .seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
  .legend{display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--color-text-secondary);flex-wrap:wrap}
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
</style></head>
<body>
<div class="grads">
  <div class="g" style="background:var(--gradient-soft);color:var(--color-text-primary);text-shadow:none">soft</div>
  <div class="g" style="background:var(--gradient-warm)">warm</div>
  <div class="g" style="background:var(--gradient-editorial)">editorial</div>
</div>
<div class="bal">
  <div class="seg" style="flex:60;background:var(--mint-100);color:var(--color-text-primary)">60%</div>
  <div class="seg" style="flex:25;background:var(--forest-700);color:#fff">25%</div>
  <div class="seg" style="flex:10;background:var(--blush-400);color:var(--forest-700)">10%</div>
  <div class="seg" style="flex:5;background:var(--rose-500);color:#fff">5%</div>
</div>
<div class="legend">
  <span><span class="dot" style="background:var(--mint-100)"></span>Mint Cream · fundos</span>
  <span><span class="dot" style="background:var(--forest-700)"></span>Black Forest · texto & CTA</span>
  <span><span class="dot" style="background:var(--blush-400)"></span>Powder Blush · destaques</span>
  <span><span class="dot" style="background:var(--rose-500)"></span>Dusty Rose · detalhes</span>
</div>
</body></html>
