name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela runs antigos do mesmo ref (economiza minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Escopo mínimo do GITHUB_TOKEN (read). Eleve por job se algum precisar de write.
permissions:
  contents: read

jobs:
  gate:
    name: typecheck · lint · tests (RLS)
    runs-on: ubuntu-latest
    # Postgres efêmero no runner (grátis) — replica o ambiente Supabase para os
    # testes de RLS (roles authenticated/anon/service_role + auth.uid()).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kabrito_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/kabrito_test
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/kabrito_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Roles + schema auth (igual ao Supabase) ANTES das migrations.
      - name: Bootstrap do banco de teste
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/rls/bootstrap.local.sql
      - name: Migrations
        run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      # Inclui os 39 testes de RLS (defesa multi-tenant) — nunca regride sem barrar.
      - run: npm test

  secrets-scan:
    name: scan de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          # Histórico completo: necessário para o scan de histórico abaixo.
          fetch-depth: 0
      - name: gitleaks
        run: |
          VERSION=8.18.4
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          FILE="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSL "${BASE}/${FILE}" -o "${FILE}"
          curl -sSL "${BASE}/gitleaks_${VERSION}_checksums.txt" -o checksums.txt
          # Verifica a integridade do binário contra os checksums oficiais do
          # release ANTES de executá-lo (é a ferramenta que decide se vazou segredo).
          grep -F "${FILE}" checksums.txt | sha256sum -c -
          tar -xzf "${FILE}" gitleaks
          # 1) Arquivos atuais: pega segredo colado num arquivo do PR.
          ./gitleaks detect --no-git --config .gitleaks.toml --redact --verbose --exit-code 1
          # 2) Histórico completo (todas as refs): o repo é PÚBLICO — um segredo
          # commitado e depois revertido continua exposto no log. Varre tudo.
          ./gitleaks detect --config .gitleaks.toml --redact --verbose --exit-code 1 --log-opts="--all"
